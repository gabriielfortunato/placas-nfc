<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Placas NFC & QR Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- SCRIPT DE REDIRECIONAMENTO AUTOMÁTICO (Executa antes de carregar o layout) -->
    <script>
        (function() {
            // Busca placas salvas no localStorage
            const placas = JSON.parse(localStorage.getItem('placas_nfc')) || [];
            
            // Verifica se a URL contém o parâmetro ?r=ID (ex: ?r=PLACA-001)
            const urlParams = new URLSearchParams(window.location.search);
            const placaId = urlParams.get('r');

            if (placaId) {
                // Procura a placa cadastrada no sistema
                const placaEncontrada = placas.find(p => p.id.toLowerCase() === placaId.toLowerCase());

                if (placaEncontrada && placaEncontrada.url) {
                    // Esconde o corpo da página para não piscar o painel
                    document.documentElement.style.display = 'none';
                    
                    // Garante que a URL tenha protocolo (http:// ou https://)
                    let urlDestino = placaEncontrada.url;
                    if (!urlDestino.startsWith('http://') && !urlDestino.startsWith('https://')) {
                        urlDestino = 'https://' + urlDestino;
                    }

                    // Redireciona o visitante para o destino final da placa
                    window.location.href = urlDestino;
                } else {
                    alert(`A placa "${placaId}" ainda não foi configurada no painel!`);
                }
            }
        })();
    </script>

    <!-- PAINEL DE CONTROLE (Exibido apenas para você) -->
    <header class="bg-slate-900 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-qrcode text-blue-400"></i> Painel Placas NFC & QR
            </h1>
            <span class="text-xs bg-blue-600 px-3 py-1 rounded-full">Vercel Ready</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">

        <section class="bg-white rounded-lg shadow-sm p-5 border border-gray-200">
            <h2 class="text-lg font-semibold text-slate-800 mb-3">Cadastrar Nova Placa</h2>
            <form id="form-cadastrar" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" id="input-id" placeholder="ID da Placa (ex: PLACA-001)" required class="border rounded p-2 text-sm focus:outline-blue-500">
                <input type="url" id="input-url" placeholder="URL de Destino Inicial" class="border rounded p-2 text-sm focus:outline-blue-500">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded text-sm transition">
                    <i class="fas fa-plus"></i> Criar Placa
                </button>
            </form>
        </section>

        <section class="bg-white rounded-lg shadow-sm p-5 border border-gray-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-800">Placas Cadastradas</h2>
                <input type="text" id="input-busca" placeholder="Buscar por ID..." class="border rounded px-3 py-1 text-sm focus:outline-blue-500">
            </div>
            <div id="lista-placas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
        </section>

    </main>

    <script>
        let placas = JSON.parse(localStorage.getItem('placas_nfc')) || [
            { id: 'PLACA-001', url: 'https://instagram.com' },
            { id: 'PLACA-002', url: 'https://google.com' }
        ];

        function salvarPlacas() {
            localStorage.setItem('placas_nfc', JSON.stringify(placas));
        }

        function renderizarPlacas(filtro = '') {
            const container = document.getElementById('lista-placas');
            container.innerHTML = '';

            const placasFiltradas = placas.filter(p => p.id.toLowerCase().includes(filtro.toLowerCase()));

            if (placasFiltradas.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm col-span-full">Nenhuma placa encontrada.</p>';
                return;
            }

            placasFiltradas.forEach(placa => {
                const card = document.createElement('div');
                card.className = 'border rounded-lg p-4 bg-slate-50 flex flex-col justify-between space-y-3';

                // URL Fixa gravada no QR Code / Tag NFC (usando parâmetro ?r=ID)
                const baseUrl = window.location.origin + window.location.pathname;
                const urlFixaRedirecionamento = `${baseUrl}?r=${placa.id}`;

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-900">${placa.id}</span>
                            <a href="${urlFixaRedirecionamento}" target="_blank" title="Testar Redirecionamento" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded">
                                <i class="fas fa-external-link-alt"></i> Testar
                            </a>
                        </div>
                        <p class="text-xs text-gray-500 truncate mt-1">Destino: <a href="${placa.url || '#'}" target="_blank" class="text-blue-600 underline font-medium">${placa.url || 'Não configurado'}</a></p>
                        <p class="text-xs text-gray-400 truncate mt-0.5">Link no QR/NFC: <span class="font-mono text-gray-600">${urlFixaRedirecionamento}</span></p>
                    </div>
                    <div id="qr-${placa.id}" class="flex justify-center p-2 bg-white rounded border"></div>
                    <div class="flex gap-2">
                        <button onclick="editarPlaca('${placa.id}')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white text-xs py-2 rounded transition">
                            <i class="fas fa-edit"></i> Configurar Destino
                        </button>
                        <button onclick="excluirPlaca('${placa.id}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-2 rounded transition">Excluir</button>
                    </div>
                `;

                container.appendChild(card);

                // O QR Code é gerado sempre com o link fixo com ?r=ID
                new QRCode(document.getElementById(`qr-${placa.id}`), {
                    text: urlFixaRedirecionamento,
                    width: 120,
                    height: 120
                });
            });
        }

        document.getElementById('form-cadastrar').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('input-id').value.trim();
            const url = document.getElementById('input-url').value.trim();

            if (placas.some(p => p.id === id)) {
                alert('Esse ID já existe!');
                return;
            }

            placas.push({ id, url });
            salvarPlacas();
            renderizarPlacas();
            e.target.reset();
        });

        document.getElementById('input-busca').addEventListener('input', (e) => {
            renderizarPlacas(e.target.value);
        });

        function editarPlaca(id) {
            const placa = placas.find(p => p.id === id);
            const novaUrl = prompt(`Digite a nova URL de destino para a placa ${id}:`, placa.url);
            if (novaUrl !== null) {
                placa.url = novaUrl;
                salvarPlacas();
                renderizarPlacas();
            }
        }

        function excluirPlaca(id) {
            if (confirm(`Tem certeza que deseja excluir a placa ${id}?`)) {
                placas = placas.filter(p => p.id !== id);
                salvarPlacas();
                renderizarPlacas();
            }
        }

        renderizarPlacas();
    </script>
</body>
</html>
