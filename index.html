<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlacaGO - Hub de Gestão de Placas NFC & QR Code Dinâmico</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            },
            acrylic: {
              gold: '#d4af37',
              rose: '#b76e79',
              clear: 'rgba(255, 255, 255, 0.15)',
              dark: '#18181b'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Chart.js for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti for Interactive Scan Simulation -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Glassmorphism effects for Acrylic Preview */
    .glass-acrylic {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.1);
    }

    .glass-acrylic-black {
      background: linear-gradient(145deg, #18181b, #09090b);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .glass-acrylic-gold {
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      color: #111;
      box-shadow: 0 20px 40px rgba(179, 135, 40, 0.3);
    }

    /* Phone Tap Simulation Animation */
    @keyframes phoneTap {
      0% { transform: translateY(120px) scale(0.8) rotate(-10deg); opacity: 0; }
      50% { transform: translateY(-10px) scale(1.02) rotate(0deg); opacity: 1; }
      70% { transform: translateY(0px) scale(1); opacity: 1; }
      100% { transform: translateY(0px) scale(1); opacity: 1; }
    }
    .animate-phone-tap {
      animation: phoneTap 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Pulse Glow for NFC Symbol */
    @keyframes nfcPulse {
      0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.6); }
      70% { box-shadow: 0 0 0 15px rgba(14, 165, 233, 0); }
      100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
    }
    .nfc-pulse {
      animation: nfcPulse 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Dados reais carregados do backend.

    // SVG Icons Map
    const CategoryIcons = {
      google: (cls="w-5 h-5") => (
        <svg className={cls} viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
      ),
      instagram: (cls="w-5 h-5") => (
        <svg className={cls} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      ),
      whatsapp: (cls="w-5 h-5") => (
        <svg className={cls} viewBox="0 0 24 24" fill="currentColor">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.205 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
        </svg>
      ),
      wifi: (cls="w-5 h-5") => (
        <svg className={cls} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      ),
      menu: (cls="w-5 h-5") => (
        <svg className={cls} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
      ),
      custom: (cls="w-5 h-5") => (
        <svg className={cls} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      )
    };

    const CategoryBadge = ({ category }) => {
      const config = {
        google: { label: 'Google Avaliações', bg: 'bg-blue-500/10 text-blue-400 border-blue-500/20' },
        instagram: { label: 'Instagram', bg: 'bg-pink-500/10 text-pink-400 border-pink-500/20' },
        whatsapp: { label: 'WhatsApp', bg: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' },
        wifi: { label: 'Wi-Fi Grátis', bg: 'bg-teal-500/10 text-teal-400 border-teal-500/20' },
        menu: { label: 'Cardápio Digital', bg: 'bg-amber-500/10 text-amber-400 border-amber-500/20' },
        custom: { label: 'Link Personalizado', bg: 'bg-purple-500/10 text-purple-400 border-purple-500/20' }
      };
      const item = config[category] || config.custom;

      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border ${item.bg}`}>
          {CategoryIcons[category] ? CategoryIcons[category]('w-3.5 h-3.5') : null}
          {item.label}
        </span>
      );
    };

    // Helper for Toast Notifications
    function Toast({ toast, onClose }) {
      if (!toast) return null;
      return (
        <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-slate-900 border border-slate-700 text-white px-5 py-3.5 rounded-xl shadow-2xl animate-bounce">
          <div className={`w-3 h-3 rounded-full ${toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}></div>
          <p className="text-sm font-medium">{toast.message}</p>
          <button onClick={onClose} className="ml-2 text-slate-400 hover:text-white">✕</button>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      // Base Domain for NFC Link Hub
      const baseUrl = window.location.origin + '/r/';

      const [plates,setPlates]=useState([]); const [logs,setLogs]=useState([]);
      const [activeTab,setActiveTab]=useState('dashboard'); const [searchQuery,setSearchQuery]=useState(''); const [filterCategory,setFilterCategory]=useState('all'); const [toast,setToast]=useState(null);
      const [isAddModalOpen,setIsAddModalOpen]=useState(false); const [editingPlate,setEditingPlate]=useState(null); const [qrModalPlate,setQrModalPlate]=useState(null);
      const [studioPlate,setStudioPlate]=useState(null); const [studioMaterial,setStudioMaterial]=useState('clear'); const [studioShape,setStudioShape]=useState('l-stand'); const [studioHeading,setStudioHeading]=useState('Nos avalie no Google'); const [studioSubtitle,setStudioSubtitle]=useState('Aproxime seu celular ou escaneie o QR Code');
      const [simPlate,setSimPlate]=useState(null); const [simState,setSimState]=useState('idle'); const [simRedirectResult,setSimRedirectResult]=useState(null);
      const [auth,setAuth]=useState({loading:true,authenticated:false,setupRequired:false}); const [authPassword,setAuthPassword]=useState(''); const [authSetupToken,setAuthSetupToken]=useState(''); const [authError,setAuthError]=useState(''); const [authBusy,setAuthBusy]=useState(false); const [csrfToken,setCsrfToken]=useState('');
      const api=async(url,options={})=>{const headers={'Content-Type':'application/json',...(options.headers||{})};if(csrfToken&&!['GET','HEAD'].includes((options.method||'GET').toUpperCase()))headers['X-CSRF-Token']=csrfToken;const response=await fetch(url,{...options,headers,credentials:'same-origin'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.erro||'Não foi possível concluir a operação.');return data;};
      const loadData=async()=>{const result=await Promise.all([api('/api/placas'),api('/api/logs')]);setPlates(result[0]);setLogs(result[1]);setStudioPlate(cur=>cur?(result[0].find(x=>x.id===cur.id)||result[0][0]||null):(result[0][0]||null));setSimPlate(cur=>cur?(result[0].find(x=>x.id===cur.id)||result[0][0]||null):(result[0][0]||null));};
      useEffect(()=>{(async()=>{try{const status=await fetch('/api/auth/status',{credentials:'same-origin'}).then(r=>r.json());setAuth({loading:false,authenticated:!!status.authenticated,setupRequired:!!status.setup_required});setCsrfToken(status.csrf_token||'');if(status.authenticated)await loadData();}catch(e){setAuth({loading:false,authenticated:false,setupRequired:false});setAuthError('Não foi possível conectar ao servidor.');}})();},[]);
      const handleAuth=async(e)=>{e.preventDefault();setAuthBusy(true);setAuthError('');try{const path=auth.setupRequired?'/api/auth/setup':'/api/auth/login';const body=auth.setupRequired?{setup_token:authSetupToken,password:authPassword}:{password:authPassword};const response=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.erro||'Falha na autenticação.');const status=await fetch('/api/auth/status',{credentials:'same-origin'}).then(r=>r.json());setCsrfToken(status.csrf_token||'');setAuth({loading:false,authenticated:!!status.authenticated,setupRequired:!!status.setup_required});setAuthPassword('');setAuthSetupToken('');if(status.authenticated)await loadData();}catch(err){setAuthError(err.message);}finally{setAuthBusy(false);}};
      const handleLogout=async()=>{try{await api('/api/auth/logout',{method:'POST',body:'{}'});}catch(e){}setAuth({loading:false,authenticated:false,setupRequired:false});setPlates([]);setLogs([]);};
      const showToast=(message,type='success')=>{setToast({message,type});setTimeout(()=>setToast(null),3500);};
      const handleSavePlate=async(formData)=>{try{const payload={clientName:formData.clientName,category:formData.category,targetUrl:formData.targetUrl,location:formData.location,active:formData.active,accentColor:formData.accentColor||'#4285F4',heading:formData.heading||'',subtitle:formData.subtitle||''};if(editingPlate)await api('/api/placas/'+encodeURIComponent(editingPlate.slug),{method:'PUT',body:JSON.stringify(payload)});else await api('/api/placas',{method:'POST',body:JSON.stringify({...payload,slug:formData.slug})});await loadData();showToast(editingPlate?'Placa atualizada; link fixo preservado.':'Placa cadastrada.');setIsAddModalOpen(false);setEditingPlate(null);}catch(e){showToast(e.message,'error');}};
      const handleDeletePlate=async(id)=>{const plate=plates.find(p=>p.id===id);if(!plate||!confirm('Arquivar esta placa? O QR Code continuará reservado e não poderá ser reutilizado.'))return;try{await api('/api/placas/'+encodeURIComponent(plate.slug),{method:'PATCH',body:JSON.stringify({active:false})});await loadData();showToast('Placa arquivada; identificador preservado.');}catch(e){showToast(e.message,'error');}};
      const handleToggleActive=async(id)=>{const plate=plates.find(p=>p.id===id);if(!plate)return;try{await api('/api/placas/'+encodeURIComponent(plate.slug),{method:'PATCH',body:JSON.stringify({active:!plate.active})});await loadData();showToast(plate.active?'Placa desativada.':'Placa ativada.');}catch(e){showToast(e.message,'error');}};
      const copyToClipboard=(text,label='Link')=>{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text);showToast(label+' copiado!');}else{const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();showToast(label+' copiado!');}};
      const triggerSimulatedScan=(type='NFC')=>{if(!simPlate)return;setSimState('tapping');setTimeout(()=>{if(!simPlate.active){setSimState('scanned');setSimRedirectResult({success:false,message:'Placa inativa: redirecionamento pausado.'});showToast('Placa inativa.','error');return;}setSimState('scanned');setSimRedirectResult({success:true,targetUrl:simPlate.targetUrl,clientName:simPlate.clientName,category:simPlate.category});try{confetti({particleCount:60,spread:70,origin:{y:0.6}});}catch(e){}showToast('Simulação visual: nenhuma leitura real foi contabilizada.');},1200);};
      // Total Scans computation
      const totalScans = plates.reduce((acc, p) => acc + p.scans, 0);
      const activePlatesCount = plates.filter(p => p.active).length;
      const topPlate = [...plates].sort((a,b) => b.scans - a.scans)[0];

      if(auth.loading) return <div className="min-h-screen flex items-center justify-center bg-slate-950 text-slate-200">Carregando PlacaGO...</div>;
      if(!auth.authenticated) return (
        <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
          <form onSubmit={handleAuth} className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-5">
            <div className="text-center"><h1 className="text-3xl font-extrabold text-white">Placa<span className="text-sky-400">GO</span></h1><p className="text-sm text-slate-400 mt-2">{auth.setupRequired?'Configuração inicial do administrador':'Acesso administrativo'}</p></div>
            {auth.setupRequired&&<div><label className="block text-xs text-slate-300 mb-2">Código de configuração</label><input required type="password" value={authSetupToken} onChange={e=>setAuthSetupToken(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white"/></div>}
            <div><label className="block text-xs text-slate-300 mb-2">{auth.setupRequired?'Crie uma senha de administrador':'Senha de administrador'}</label><input required minLength="12" type="password" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white" autoComplete={auth.setupRequired?'new-password':'current-password'}/>{auth.setupRequired&&<p className="text-[11px] text-slate-500 mt-2">Use uma senha exclusiva com pelo menos 12 caracteres.</p>}</div>
            {authError&&<p className="text-sm text-red-400">{authError}</p>}
            <button disabled={authBusy} className="w-full bg-sky-600 hover:bg-sky-500 disabled:opacity-50 text-white font-bold rounded-xl p-3">{authBusy?'Aguarde...':auth.setupRequired?'Criar administrador':'Entrar'}</button>
          </form>
        </div>
      );
      return (
        <div className="min-h-screen flex flex-col bg-slate-950">
          
          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
                  <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                  </svg>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-lg text-white tracking-tight">Placa<span className="text-sky-400">GO</span></span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-semibold bg-sky-500/20 text-sky-400 border border-sky-500/30">NFC LINK HUB</span>
                  </div>
                  <p className="text-xs text-slate-400">Gerenciador & Redirecionador Dinâmico</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 ${activeTab === 'dashboard' ? 'bg-sky-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                  Dashboard
                </button>
                <button
                  onClick={() => setActiveTab('plates')}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 ${activeTab === 'plates' ? 'bg-sky-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                  Minhas Placas ({plates.length})
                </button>

                    <h3 className="text-base font-bold text-white">Bloqueie com Senha (Opcional)</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      No menu <b>Outros &gt; Bloquear Tag</b> do app, você pode definir uma senha de segurança para evitar que curiosos regravem ou apaguem a placa física do seu cliente.
                    </p>
                  </div>

                </div>

                {/* Technical Comparison Sheet */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                  <h3 className="text-base font-bold text-white">Ficha Técnica dos Chips de Mercado</h3>
                  
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-slate-950 text-slate-400 font-semibold border-b border-slate-800">
                        <tr>
                          <th className="p-3">Modelo</th>
                          <th className="p-3">Memória Útil</th>
                          <th className="p-3">Custo-Benefício</th>
                          <th className="p-3">Recomendação para Plaquinhas</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        <tr>
                          <td className="p-3 font-bold text-white">NTAG213</td>
                          <td className="p-3 font-mono">144 bytes</td>
                          <td className="p-3 text-amber-400">Muito Barato</td>
                          <td className="p-3">Aceitável apenas para links curtos simples. Pode faltar espaço em URLs longas.</td>
                        </tr>
                        <tr className="bg-sky-500/10">
                          <td className="p-3 font-bold text-sky-400 flex items-center gap-1">NTAG215 ★</td>
                          <td className="p-3 font-mono font-bold text-sky-400">504 bytes</td>
                          <td className="p-3 text-emerald-400 font-bold">Ideal / Excelente</td>
                          <td className="p-3 font-bold text-white">A OPÇÃO PERFEITA. Padrão de mercado com sobra de memória e 100% de compatibilidade.</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-bold text-white">NTAG216</td>
                          <td className="p-3 font-mono">888 bytes</td>
                          <td className="p-3 text-red-400">Caro</td>
                          <td className="p-3">Exagero para placas web. Necessário apenas para salvar vCards de contatos completos offline.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Data Backup & Export Section */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div>
                    <h3 className="text-sm font-bold text-white">Backup e Exportação de Dados</h3>
                    <p className="text-xs text-slate-400">Exporte todo o seu cadastro de placas e estatísticas em arquivo JSON para ter cópia de segurança.</p>
                  </div>

                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(plates, null, 2));
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.setAttribute("href", dataStr);
                        downloadAnchor.setAttribute("download", `placago_backup_${new Date().toISOString().split('T')[0]}.json`);
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        downloadAnchor.remove();
                        showToast('Backup exportado com sucesso!');
                      }}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold text-xs px-4 py-2.5 rounded-xl flex items-center gap-2"
                    >
                      <svg className="w-4 h-4 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                      Exportar JSON
                    </button>

                    <button
                      onClick={() => {
                        if (confirm('Atualizar os dados do banco de dados?')) { loadData().then(()=>showToast('Dados atualizados.')).catch(e=>showToast(e.message,'error')); }
                      }}
                      className="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 font-semibold text-xs px-4 py-2.5 rounded-xl"
                    >
                      Atualizar dados
                    </button>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-slate-900 border-t border-slate-800 py-6 mt-12">
            <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
              <p>PlacaGO © 2026 - Hub de Gerenciamento e Redirecionamento Dinâmico de Placas NFC NTAG215 & QR Code.</p>
            </div>
          </footer>

          {/* ----------------- MODAL 1: ADICIONAR / EDITAR PLACA ----------------- */}
          {isAddModalOpen && (
            <PlateFormModal
              plate={editingPlate}
              onClose={() => { setIsAddModalOpen(false); setEditingPlate(null); }}
              onSave={handleSavePlate}
            />
          )}

          {/* ----------------- MODAL 2: QR CODE HIGH-RES DOWNLOAD ----------------- */}
          {qrModalPlate && (
            <QrCodeDownloadModal
              plate={qrModalPlate}
              baseUrl={baseUrl}
              onClose={() => setQrModalPlate(null)}
              onCopy={copyToClipboard}
            />
          )}

          {/* TOAST NOTIFICATION */}
          <Toast toast={toast} onClose={() => setToast(null)} />

        </div>
      );
    }

    // --- HELPER COMPONENT: QR CODE RENDERER ---
    function QrCodeRenderer({ url, size = 160 }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        containerRef.current.innerHTML = '';
        try {
          new QRCode(containerRef.current, {
            text: url,
            width: size,
            height: size,
            colorDark: "#09090b",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        } catch(e) {}
      }, [url, size]);

      return <div ref={containerRef} className="flex items-center justify-center"></div>;
    }

    // --- MODAL COMPONENT: ADD / EDIT PLATE ---
    function PlateFormModal({ plate, onClose, onSave }) {
      const [clientName, setClientName] = useState(plate ? plate.clientName : '');
      const [slug, setSlug] = useState(plate ? plate.slug : '');
      const [category, setCategory] = useState(plate ? plate.category : 'google');
      const [targetUrl, setTargetUrl] = useState(plate ? plate.targetUrl : '');
      const [location, setLocation] = useState(plate ? plate.location : '');
      const [active, setActive] = useState(plate ? plate.active : true);

      // Auto-generate slug from Client Name
      const handleNameChange = (val) => {
        setClientName(val);
        if (!plate) {
          const autoSlug = val.toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '');
          setSlug(autoSlug);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!clientName || !slug || !targetUrl) return;
        onSave({ clientName, slug, category, targetUrl, location, active });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl animate-fadeIn space-y-6">
            
            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
              <h3 className="text-lg font-bold text-white">
                {plate ? 'Editar Placa Inteligente (link fixo)' : 'Cadastrar Nova Placa Interativa'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              
              <div>
                <label className="block font-semibold text-slate-300 mb-1">Nome do Cliente / Estabelecimento *</label>
                <input
                  type="text"
                  required
                  placeholder="Ex: Padaria & Confeitaria Silva"
                  value={clientName}
                  onChange={(e) => handleNameChange(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-sky-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block font-semibold text-slate-300 mb-1">Identificador Slug (Único) *</label>
                  <div className="relative">
                    <input
                      type="text"
                      required
                      placeholder="padaria-silva"
                      value={slug}
                      onChange={(e) => setSlug(e.target.value.toLowerCase().replace(/\s+/g, '-'))}
                      disabled={!!plate}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white font-mono focus:outline-none focus:border-sky-500"
                    />
                  </div>
                </div>

                <div>
                  <label className="block font-semibold text-slate-300 mb-1">Categoria da Placa</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-sky-500"
                  >
                    <option value="google">Google Avaliações</option>
                    <option value="instagram">Instagram</option>
                    <option value="menu">Cardápio Digital</option>
                    <option value="wifi">Conexão Wi-Fi</option>
                    <option value="whatsapp">WhatsApp / Agendamento</option>
                    <option value="custom">Link Personalizado</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-300 mb-1">URL de Destino Final *</label>
                <input
                  type="url"
                  required
                  placeholder="https://g.page/r/exemplo/review"
                  value={targetUrl}
                  onChange={(e) => setTargetUrl(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-sky-500 font-mono"
                />
                <p className="text-[10px] text-slate-500 mt-1">Para onde o cliente final será enviado ao encostar o celular na placa física.</p>
              </div>

              <div>
                <label className="block font-semibold text-slate-300 mb-1">Localização no Estabelecimento</label>
                <input
                  type="text"
                  placeholder="Ex: Balcão Principal - Caixa 01"
                  value={location}
                  onChange={(e) => setLocation(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-sky-500"
                />
              </div>

              <div className="flex items-center gap-2 pt-2">
                <input
                  type="checkbox"
                  id="activeCheck"
                  checked={active}
                  onChange={(e) => setActive(e.target.checked)}
                  className="w-4 h-4 rounded bg-slate-950 border-slate-800 text-sky-500 focus:ring-0"
                />
                <label htmlFor="activeCheck" className="text-slate-300 font-semibold cursor-pointer">
                  Placa Ativa (Redirecionamento Habilitado)
                </label>
              </div>

              <div className="pt-4 border-t border-slate-800 flex items-center justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl text-slate-400 hover:text-white font-medium"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="bg-sky-600 hover:bg-sky-500 text-white font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-sky-500/20"
                >
                  Salvar Placa
                </button>
              </div>

            </form>

          </div>
        </div>
      );
    }

    // --- MODAL COMPONENT: QR CODE HIGH-RES DOWNLOAD ---
    function QrCodeDownloadModal({ plate, baseUrl, onClose, onCopy }) {
      const fullNfcUrl = `${baseUrl}${plate.slug}`;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl animate-fadeIn space-y-6 text-center">
            
            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
              <h3 className="text-base font-bold text-white text-left">
                QR Code Dinâmico - {plate.clientName}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            {/* Rendered QR Code Container */}
            <div className="bg-white p-6 rounded-2xl inline-block shadow-xl border-4 border-slate-800">
              <QrCodeRenderer url={fullNfcUrl} size={180} />
            </div>

            <div className="space-y-2 text-xs">
              <p className="font-mono text-slate-300 bg-slate-950 p-2 rounded-xl border border-slate-800 truncate">
                {fullNfcUrl}
              </p>
              <p className="text-slate-400 text-[11px]">
                Imprima este QR Code na arte da placa física junto ao ícone NFC.
              </p>
            </div>

            <div className="flex items-center gap-3 pt-2">
              <button
                onClick={() => onCopy(fullNfcUrl, 'URL da Placa')}
                className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs py-2.5 rounded-xl border border-slate-700"
              >
                Copiar Link
              </button>
              <button
                onClick={() => {
                  const img = document.querySelector('#studio-qrcode img') || document.querySelector('.bg-white img');
                  if (img && img.src) {
                    const link = document.createElement('a');
                    link.href = img.src;
                    link.download = `qrcode_${plate.slug}.png`;
                    link.click();
                  }
                }}
                className="flex-1 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs py-2.5 rounded-xl shadow-lg shadow-sky-500/20"
              >
                Baixar Imagem PNG
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
